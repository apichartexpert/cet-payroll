<style>
/* Layout: fixed sidebar workbench; period selector in topbar drives every module */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#171f1a; --panel2:#1d2721; --fg:#e6efe9; --muted:#94a89b;
  --line:#2a362e; --accent:#39b377; --accent-fg:#07130c; --accent-soft:#1b3328;
  --amber:#dca53f; --amber-soft:#332a16; --red:#e2705f; --red-soft:#3a201b;
  --blue:#6ba3d0; --blue-soft:#1a2733; --shadow:0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#171f1a; --panel2:#1d2721; --fg:#e6efe9; --muted:#94a89b;
  --line:#2a362e; --accent:#39b377; --accent-fg:#07130c; --accent-soft:#1b3328;
  --amber:#dca53f; --amber-soft:#332a16; --red:#e2705f; --red-soft:#3a201b;
  --blue:#6ba3d0; --blue-soft:#1a2733; --shadow:0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:'IBM Plex Sans Thai',-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;min-height:100%}
/* sidebar */

/* server mode */
#userchip{display:flex;gap:6px;align-items:center}
.dlglogin{max-width:min(380px,92vw);width:380px}
.login{display:flex;flex-direction:column;gap:12px;padding:22px}

.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 16px}

.stp.done .n{background:var(--accent);color:var(--accent-fg)}

.drop{border:2px dashed var(--accent);border-radius:14px;background:var(--accent-soft);padding:26px 18px;text-align:center;cursor:pointer;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.drop b{font-size:15px;color:var(--accent)}.drop span{font-size:12px;color:var(--muted)}

.fcards{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}

.pwrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.pwrow input{flex:1;min-width:160px;max-width:280px}
.sn{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);align-items:center;justify-content:center;font-size:11px;margin-right:6px}
.actionbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--accent);border-radius:12px;background:var(--panel);padding:12px 14px;margin:6px 0 16px}

#dropOverlay{position:fixed;inset:0;z-index:200;background:rgba(21,121,75,.18);display:flex;align-items:center;justify-content:center;pointer-events:none}

.step small{color:var(--muted);font-size:11px}
/* form grid */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px}
.fgrid label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);

.histgrid{display:grid;grid-template-columns:auto repeat(5,1fr);gap:3px 6px;font-size:11.5px;align-items:center}
.histgrid input{width:100%;text-align:right;padding:2px 5px;font-size:11.5px}
.histgrid .hh{font-weight:700;color:var(--muted);font-size:10.5px}
.brk{font-size:12.5px}
.brk table{font-size:12.5px}
.searchbox{min-width:180px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--fg);color:var(--bg);border-radius:9px;padding:9px 18px;font-weight:600;z-index:99;box-shadow:var(--shadow)}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:15px;color:var(--fg);margin-bottom:6px}
.acct-grid{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;align-items:center;max-width:560px}
@media (max-width:860px){
  #app{flex-direction:column}
  #side{width:100%;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);

<script>
'use strict';
/* ================= state ================= */
const LSKEY='cet.payroll.v1';
const THMONTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const BRACKETS=[[150000,0],[300000,.05],[500000,.10],[750000,.15],[1000000,.20],[2000000,.25],[5000000,.30],[Infinity,.35]];
const ALLOW_FIELDS=[
 ['self','ส่วนตัว (60,000)'],['spouse','คู่สมรส'],['childNS','บุตรไม่ศึกษา'],['childS','บุตรกำลังศึกษา'],
 ['parent','บิดามารดา'],['lifeIns','เบี้ยประกันชีวิต/สุขภาพ'],['rmfLtf','RMF / LTF / กองทุนลดหย่อน'],
 ['ssfEsg','SSF / ThaiESG'],['special','ลดหย่อนพิเศษ'],['housing','ดอกเบี้ยบ้าน'],['donation','เงินบริจาค']];

function defaultState(){return {
  company:{nameTH:'บริษัท คอนสแตนท์ เอ็นเนอร์ยี่ เซอร์วิสเซส (ไทยแลนด์) จำกัด',nameEN:'Constant Energy Services (Thailand) Co., Ltd.',
    taxIdCo:'0105562203030',ssoAccount:'',ssoBranch:'000000',branch:'0',payBankAcct:'',payBankName:'ธนาคารกรุงเทพ (BBL)',
    bblName:'CET',remitAcct:'',remitName:''},
  settings:{ssoRate:5,ssoCeil:17500,ssoFloor:1650,whtMethod:'level',whtRound:'baht',
    accounts:{
      salaryExp:{code:'530101',name:'เงินเดือน ค่าจ้าง'},
      ssoExp:{code:'530104',name:'เงินสมทบประกันสังคม กองทุนทดแทน'},
      pfExp:{code:'530105',name:'เงินสมทบกองทุนสำรองเลี้ยงชีพ'},
      whtPay:{code:'215201',name:'ภ.ง.ด.1 ค้างจ่าย'},
      ssoPay:{code:'215501',name:'ประกันสังคมค้างจ่าย'},
      pfPay:{code:'212302',name:'กองทุนสำรองเลี้ยงชีพค้างจ่าย'},
      loanPay:{code:'212309',name:'เงินกู้ กยศ. รอนำส่ง'},
      salPay:{code:'212301',name:'เงินเดือนค้างจ่าย'},
      bank:{code:'111301',name:'ธนาคาร - บัญชีออมทรัพย์ (BBL)'}
    }},
  historyYear:2026,historyThroughMonth:0,
  employees:[],runs:{},bonusRuns:{}
};}
let S=defaultState();
try{const raw=localStorage.getItem(LSKEY);if(raw){const p=JSON.parse(raw);S=Object.assign(defaultState(),p);
  S.settings=Object.assign(defaultState().settings,p.settings||{});S.settings.accounts=Object.assign(defaultState().settings.accounts,(p.settings||{}).accounts||{});
  S.company=Object.assign(defaultState().company,p.company||{});}}catch(e){}
function migrate(){
  if(!S.company.taxIdCo)S.company.taxIdCo='0105562203030';
  if((S.v||0)<4){
    S.settings.whtMethod='level';
    for(const run of Object.values(S.runs||{})){if(run.status==='locked')continue;
      for(const r of Object.values(run.rows||{})){if(r.studentLoan===0)r.studentLoan=null;if(r.incentive===0)r.incentive=null;}}
    S.v=4;
  }
}

/* ================= helpers ================= */
const fmt=n=>(n==null||isNaN(n))?'–':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(n==null||isNaN(n))?'–':Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(n)?0:n;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const digits=s=>String(s||'').replace(/\D/g,'');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
const ssoIdOf=e=>digits(e.ssoId)||digits(e.taxId); // foreigners: SSO number differs from the RD tax ID
const nameThOf=e=>String(e.nameTh||e.name||'').trim(); // Thai name as filed with SSO / RD
function splitName(full){ // "Mr. Somchai Jaidee" -> {title,first,last}
  let s=String(full||'').trim(),title='';
  const en=s.match(/^(Mrs|Miss|Ms|Mr|Dr)(?:\.\s*|\s+)(.+)$/i);
  const th=s.match(/^(ว่าที่ร้อยตรีหญิง|ว่าที่ร้อยตรี|ว่าที่ ร\.ต\.|นางสาว|นาง|นาย|น\.ส\.?)\s*(.+)$/);
  if(en){title=en[1];s=en[2];}else if(th){title=th[1];s=th[2];}
  const parts=s.trim().split(/\s+/);const first=parts.shift()||'';const last=parts.join(' ');
  return{title,first,last};
}

function getRun(create){let r=S.runs[pkey()];if(!r&&create){r={status:'draft',payDate:defaultPayDate(),rows:{}};S.runs[pkey()]=r;}return r;}

const blankRow=()=>({ot:0,incentive:null,otherAdd:0,studentLoan:null,otherDed:0,paidAdvance:0,whtOverride:null,ssoOverride:null,pfOverride:null,salaryOverride:null,exclude:false});
function rowOf(run,code){if(!run.rows[code])run.rows[code]=blankRow();return run.rows[code];}

/* ================= tax engine ================= */
function taxOn(net){let t=0,prev=0;for(const[cap,rate]of BRACKETS){if(net>prev)t+=(Math.min(net,cap)-prev)*rate;prev=cap;if(net<=cap)break;}return Math.max(0,t);}
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const ym=(y,m)=>y+'-'+String(m).padStart(2,'0');
function ssoOf(emp,salary){const st=S.settings;if(emp.ssoExempt)return 0;const base=Math.min(Math.max(salary,0)<st.ssoFloor?st.ssoFloor:salary,st.ssoCeil);
  return salary>0?Math.round(base*st.ssoRate/100):0;}
/* PF is rounded up to the whole baht, as on the CET payroll register */
function pfOf(emp,salary){return Math.ceil(r2(salary*(num(emp.pfRate))/100));}
function pfErOf(emp,salary){const rate=emp.pfErRate!=null&&emp.pfErRate!==''?num(emp.pfErRate):num(emp.pfRate);return Math.ceil(r2(salary*rate/100));}
function recurAmt(emp,y,m){const k=ym(y,m);let t=0;
  for(const it of emp.recurring||[]){if(!num(it.amount))continue;if(it.fromYM&&k<it.fromYM)continue;if(it.toYM&&k>it.toYM)continue;t+=num(it.amount);}return t;}
const isSet=v=>v!=null&&v!=='';
function incAmt(emp,r,y,m){return r&&isSet(r.incentive)?num(r.incentive):recurAmt(emp,y,m);}
function loanAmt(emp,r){return r&&isSet(r.studentLoan)?num(r.studentLoan):num(emp.loanMonthly);}
function oneOff(emp,r,y,m){return (r?num(r.ot)+num(r.otherAdd):0)+incAmt(emp,r,y,m);}
function lastEmployedMonth(emp,y){if(emp.resignYM){const[ry,rm]=emp.resignYM.split('-').map(Number);if(ry===y)return rm;}return 12;}

/* a month's actuals for an employee: a locked run first, then imported actuals, then a draft run */
function monthData(emp,y,m){
  const run=S.runs[ym(y,m)];
  const row=run&&run.rows[emp.code]&&!run.rows[emp.code].exclude?run.rows[emp.code]:null;
  const fromRun=()=>{const sal=row.salaryOverride!=null?row.salaryOverride:emp.salary;const calc=calcRow(emp,row,y,m,false);const b=bonusFor(emp,y,m);
    return{income:sal,other:r2(oneOff(emp,row,y,m)+b.inc),wht:r2(calc.wht+b.wht),sso:r2(calc.sso+b.sso),pf:r2(calc.pf+b.pf),src:'run'};};
  if(row&&run.status==='locked')return fromRun();
  if(y===S.historyYear&&emp.history2026&&m<=S.historyThroughMonth){
    const h=emp.history2026;const g=(o)=>o&&o[m]!=null?num(o[m]):(o&&o[String(m)]!=null?num(o[String(m)]):0);
    return{income:g(h.income),other:g(h.other),wht:g(h.wht),sso:g(h.ssf),pf:g(h.pf),src:'hist'};
  }
  if(row)return fromRun();
  const b=bonusFor(emp,y,m);if(b.inc||b.wht)return{income:0,other:b.inc,wht:b.wht,sso:b.sso,pf:b.pf,src:'run',gap:isEmployed(emp,y,m)};
  return null;
}
function annualTax(emp,annReg,annOther,annSSO,annPF){
  const st=S.settings;const gross=annReg+annOther;
  const expense=Math.min(gross*0.5,100000);
  const A=emp.allowances||{};
  let allow=num(A.self)||60000;
  allow+=num(A.spouse)+num(A.childNS)+num(A.childS)+num(A.parent)+num(A.lifeIns)
        +num(A.rmfLtf)+num(A.ssfEsg)+num(A.special)+num(A.housing);
  allow+=Math.min(annSSO,st.ssoCeil*12*st.ssoRate/100);
  allow+=annPF;
  const beforeDonate=Math.max(0,gross-expense-allow);
  const donate=Math.min(num(A.donation),beforeDonate*0.10);
  const taxable=Math.max(0,beforeDonate-donate);
  return{gross,expense,allow,donate,taxable,tax:r2(taxOn(taxable))};
}
/* WHT for employee for a month given that month's run row r.
   level  : regular WHT held at a level amount; one-off income taxed at its marginal rate in the month paid;
            December (or the last month employed) withholds whatever is left of the annual tax.
   catchup: (annual tax - withheld YTD) / remaining months.
   std12  : regular tax / 12 + share of tax on other income. */
function computeWHT(emp,r,y,m){
  const st=S.settings;
  const curSal=r&&r.salaryOverride!=null?num(r.salaryOverride):emp.salary;
  const curOther=oneOff(emp,r,y,m);
  let annReg=0,annOther=0,annSSO=0,annPF=0,whtYTD=0;
  const months=[],gaps=[];
  for(let mm=1;mm<=12;mm++){
    if(mm<m){
      const d=monthData(emp,y,mm);
      if(d){annReg+=d.income;annOther+=d.other;annSSO+=d.sso;annPF+=d.pf;whtYTD+=d.wht;months.push({m:mm,inc:d.income,oth:d.other,wht:d.wht,src:d.src});if(d.gap)gaps.push(mm);}
      else{months.push({m:mm,inc:0,oth:0,wht:0,src:'-'});if(isEmployed(emp,y,mm)&&!(y===S.historyYear&&emp.history2026&&mm<=S.historyThroughMonth))gaps.push(mm);}
    }else{
      const inc=mm===m?curSal:(isEmployed(emp,y,mm)?num(emp.salary):0);
      const oth=mm===m?curOther:0;
      const cur=mm===m&&r;
      const sso=cur&&r.ssoOverride!=null?num(r.ssoOverride):inc>0?ssoOf(emp,inc):0;const pf=cur&&r.pfOverride!=null?num(r.pfOverride):inc>0?pfOf(emp,inc):0;
      annReg+=inc;annOther+=oth;annSSO+=sso;annPF+=pf;
      const bn=mm===m&&!histCovers(emp,y,m)?bonusFor(emp,y,m):null;
      if(bn){annOther+=bn.inc;annSSO+=bn.sso;annPF+=bn.pf;whtYTD+=bn.wht;}
      months.push({m:mm,inc,oth:bn?r2(oth+bn.inc):oth,wht:null,src:mm===m?'cur':'proj'});
    }
  }
  const all=annualTax(emp,annReg,annOther,annSSO,annPF);
  /* level method: the gap between this month's salary and the normal salary is taxed like a one-off */
  const master=num(emp.salary)||curSal;
  const curSso=r&&r.ssoOverride!=null?num(r.ssoOverride):curSal>0?ssoOf(emp,curSal):0,curPf=r&&r.pfOverride!=null?num(r.pfOverride):curSal>0?pfOf(emp,curSal):0,mSso=master>0?ssoOf(emp,master):0,mPf=master>0?pfOf(emp,master):0;
  const excl=st.whtMethod==='level'?annualTax(emp,annReg-curSal+master,annOther-curOther,annSSO-curSso+mSso,annPF-curPf+mPf)
    :annualTax(emp,annReg,annOther-curOther,annSSO,annPF);
  const taxReg=annualTax(emp,annReg,0,annSSO,annPF).tax;
  const remaining=12-m+1;
  const roundW=w=>st.whtRound==='baht'?Math.round(w):st.whtRound==='bahtUp'?Math.ceil(w):r2(w);
  let wht,level=null,extra=0,how;
  if(st.whtMethod==='level'){
    extra=r2(all.tax-excl.tax);
    if(m>=lastEmployedMonth(emp,y)){wht=r2(Math.max(0,all.tax-whtYTD));how='plug';}
    else{
      const lv=emp.whtLevel&&emp.whtLevel[y];
      if(lv&&Math.abs(num(lv.base)-master)<0.005){level=num(lv.amt);how='level';}
      else{level=roundW(Math.max(0,(excl.tax-whtYTD)/remaining));how='relevel';}
      wht=r2(Math.max(0,level+extra));
    }
  }else if(st.whtMethod==='catchup'){wht=roundW(Math.max(0,(all.tax-whtYTD)/remaining));how='catchup';}
  else{wht=roundW(taxReg/12+Math.max(0,all.tax-taxReg)*(curOther>0?(curOther/Math.max(annOther,curOther)):0));how='std12';}
  return{wht,detail:{annReg,annOther,gross:all.gross,expense:all.expense,allow:all.allow,donate:all.donate,taxableAll:all.taxable,
    taxAll:all.tax,taxExcl:excl.tax,taxReg,whtYTD,remaining,annSSO,annPF,months,gaps,level,extra,how,curSal,curOther,master}};
}
function isEmployed(emp,y,m){
  if(emp.resignYM){const[ry,rm]=emp.resignYM.split('-').map(Number);if(y>ry||(y===ry&&m>rm))return false;}
  if(emp.startYM){const[sy,sm]=emp.startYM.split('-').map(Number);if(y<sy||(y===sy&&m<sm))return false;}
  return true;
}
/* full row calc */
function calcRow(emp,r,y,m,withDetail){
  const sal=r&&r.salaryOverride!=null?num(r.salaryOverride):emp.salary;
  const inc=incAmt(emp,r,y,m);
  const other=oneOff(emp,r,y,m);
  const total=sal+other;
  const sso=r&&r.ssoOverride!=null?num(r.ssoOverride):ssoOf(emp,sal);
  const pf=r&&r.pfOverride!=null?num(r.pfOverride):pfOf(emp,sal);
  let wht,detail=null;
  if(r&&r.whtOverride!=null){wht=num(r.whtOverride);}
  else{const c=computeWHT(emp,r,y,m);wht=c.wht;detail=c.detail;}
  if(withDetail&&!detail){const c=computeWHT(emp,r,y,m);detail=c.detail;}
  const loan=loanAmt(emp,r);const oded=r?num(r.otherDed):0;const adv=r?num(r.paidAdvance):0;
  const ded=r2(wht+sso+pf+loan+oded);
  const net=r2(total-ded);
  return{sal,inc,other,total,wht,sso,pf,loan,oded,ded,net,adv,transfer:r2(net-adv),detail};
}
function runTotals(){
  const run=getRun(false);const emps=activeEmps();const out={rows:[],gross:0,sal:0,other:0,wht:0,sso:0,ssoEr:0,pf:0,pfEr:0,pfErCalc:0,loan:0,oded:0,net:0,transfer:0,count:0};
  if(!emps.length)return out;
  for(const e of emps){
    const r=run?run.rows[e.code]:null;
    if(r&&r.exclude)continue;
    const c=calcRow(e,r||{},P.y,P.m,false);
    const ssoEr=r&&r.ssoOverride!=null?num(r.ssoOverride):ssoOf(e,c.sal);
    const pfEr=pfErOf(e,c.sal);
    out.rows.push({e,r,c,ssoEr,pfEr});
    out.count++;out.gross+=c.total;out.sal+=c.sal;out.other+=c.other;out.wht+=c.wht;out.sso+=c.sso;out.ssoEr+=ssoEr;
    out.pf+=c.pf;out.pfErCalc+=pfEr;out.loan+=c.loan;out.oded+=c.oded;out.net+=c.net;out.transfer+=c.transfer;
  }
  out.pfEr=run&&isSet(run.pfErTotal)?num(run.pfErTotal):out.pfErCalc;
  for(const k of['gross','sal','other','wht','sso','ssoEr','pf','pfEr','pfErCalc','loan','oded','net','transfer'])out[k]=r2(out[k]);
  return out;
}

async function saveFile(filename,data){

function aoaToXlsx(sheets){ // [{name, aoa, widths}]

  for(const s of sheets){const ws=XLSX.utils.aoa_to_sheet(s.aoa);if(s.widths)ws['!cols']=s.widths.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,s.name);}
  return XLSX.write(wb,{type:'array',bookType:'xlsx'});
}

}

window.saveEmp=function(code){
  const g=id=>document.getElementById(id).value.trim();
  const newCode=g('f_code');if(!newCode){toast('กรุณากรอกรหัสพนักงาน');return;}
  let e=code?S.employees.find(x=>x.code===code):null;
  if(!e){if(S.employees.some(x=>x.code===newCode)){toast('รหัส '+newCode+' มีอยู่แล้ว');return;}e={code:newCode};S.employees.push(e);}
  e.name=g('f_name');e.nameTh=g('f_nameTh');e.ssoId=g('f_ssoId');e.taxId=g('f_taxId');e.position=g('f_position');e.dept=g('f_dept');e.email=g('f_email');
  e.salary=num(g('f_salary'));e.pfRate=num(g('f_pfRate'));e.bankAcct=g('f_bankAcct');
  e.startYM=g('f_startYM');e.status=document.getElementById('f_status').value;e.resignYM=g('f_resignYM');
  e.pfErRate=g('f_pfErRate')===''?null:num(g('f_pfErRate'));e.loanMonthly=num(g('f_loanMonthly'));
  e.ssoExempt=document.getElementById('f_ssoExempt').checked;e.bankTransfer=document.getElementById('f_bankTransfer').checked;
  e.recurring=num(g('f_recAmt'))?[{label:g('f_recLabel'),amount:num(g('f_recAmt')),fromYM:g('f_recFrom'),toYM:g('f_recTo')}]:[];
  e.whtLevel=e.whtLevel||{};
  if(g('f_lvlAmt')==='')delete e.whtLevel[P.y];else e.whtLevel[P.y]={amt:num(g('f_lvlAmt')),base:g('f_lvlBase')===''?e.salary:num(g('f_lvlBase'))};
  e.allowances=e.allowances||{};
  for(const[k]of ALLOW_FIELDS)e.allowances[k]=num(document.getElementById('fa_'+k).value);
  const h={income:{},other:{},wht:{},ssf:{},pf:{}};let any=false;
  document.querySelectorAll('#dlgEmp [data-h]').forEach(inp=>{const[k,m]=inp.dataset.h.split('.');const v=inp.value.trim();if(v!==''){h[k][m]=num(v);any=true;}});
  if(any)e.history2026=h;else delete e.history2026;
  queueSave();document.getElementById('dlgEmp').close();render();toast('บันทึกข้อมูล '+e.code+' แล้ว');
};
window.delEmp=function(code){
  const dlg=document.getElementById('dlgEmp');
  if(dlg.dataset.confirmDel===code){S.employees=S.employees.filter(x=>x.code!==code);delete dlg.dataset.confirmDel;queueSave();dlg.close();render();toast('ลบ '+code+' แล้ว');}
  else{dlg.dataset.confirmDel=code;toast('กดลบอีกครั้งเพื่อยืนยันการลบ '+code);}
};

      if(f==='salaryOverride'){const emp=S.employees.find(x=>x.code===inp.dataset.code);const nv=v===''?null:num(v);
        r.salaryOverride=(nv==null||Math.abs(nv-emp.salary)<0.005)?null:nv;}
      else if(f==='incentive'||f==='studentLoan'){const emp=S.employees.find(x=>x.code===inp.dataset.code);
        const base=f==='incentive'?recurAmt(emp,P.y,P.m):num(emp.loanMonthly);const nv=v===''?0:num(v);

        const base=f==='ssoOverride'?ssoOf(emp,r.salaryOverride!=null?r.salaryOverride:emp.salary):pfOf(emp,r.salaryOverride!=null?r.salaryOverride:emp.salary);
        const nv=v===''?null:num(v);r[f]=(nv==null||Math.abs(nv-base)<0.005)?null:nv;}
      else r[f]=num(v);
      queueSave();vRun(document.getElementById('view'));
    });
  });
}
window.lockRun=function(){const r=getRun(true);
  // snapshot computed values so later months use them even if master data changes
  const t=runTotals();
  for(const{e,c}of t.rows){
    const row=rowOf(r,e.code);
    if(S.settings.whtMethod==='level'){
      const d=computeWHT(e,row,P.y,P.m).detail;
      const lvl=row.whtOverride!=null?r2(Math.max(0,num(row.whtOverride)-d.extra)):d.level;
      if(lvl!=null){e.whtLevel=e.whtLevel||{};e.whtLevel[P.y]={amt:lvl,base:num(e.salary)||c.sal};}
    }
    if(row.whtOverride==null)row.whtOverride=c.wht;if(row.ssoOverride==null)row.ssoOverride=c.sso;if(row.pfOverride==null)row.pfOverride=c.pf;
    if(!isSet(row.incentive))row.incentive=c.inc;if(!isSet(row.studentLoan))row.studentLoan=c.loan;

  r.status='locked';

function prevCells(e,c){const pv=prevMonthNet(e,P.y,P.m);

function brkHow(d){
  if(d.how==='plug')return `เดือนสุดท้ายของปี/ของการทำงาน: ภาษีทั้งปี ${fmt(d.taxAll)} − หักแล้ว ${fmt(d.whtYTD)}`;
  if(d.how==='level'||d.how==='relevel'){
    const lv=d.how==='level'?`ระดับปกติ ${fmt(d.level)}`:`ระดับใหม่ ${fmt(d.level)} = (${fmt0(d.taxExcl)} − หักแล้ว ${fmt0(d.whtYTD)}) ÷ ${d.remaining}`;
    const gap=r2(d.curSal-(d.master||d.curSal));const one=r2(d.curOther+gap);
    return one?`${lv} + ภาษีส่วนเพิ่มของเงินได้ครั้งคราว${gap?' (รวมส่วนต่างเงินเดือน '+fmt(gap)+')':''} ${fmt(one)} = ${fmt(d.extra)}`:lv;
  }
  if(d.how==='catchup')return `(${fmt0(d.taxAll)} − หักแล้ว ${fmt0(d.whtYTD)}) ÷ ${d.remaining} เดือน`;

}

/* ---------- bonus runs ----------
   A bonus register (e.g. "04. Bonus_Apr2026_CET and CEST.xlsx") is an extra pay run inside a month. It is stored in
   S.bonusRuns["YYYY-MM"] = [{id,label,payDate,source,rows:{code:{name,gross,wht,sso,pf,loan,oded,net,acct}}}] and never
   touches the monthly salary run. For tax: months already covered by imported actuals (Tax calculation / data file)
   include the bonus there; for other months the bonus run is added to that month's income and tax withheld. */
const bonusRunsOf=(y,m)=>(S.bonusRuns&&S.bonusRuns[ym(y,m)])||[];
const histCovers=(emp,y,m)=>y===S.historyYear&&!!emp.history2026&&m<=S.historyThroughMonth;
function bonusFor(emp,y,m){let inc=0,wht=0,sso=0,pf=0;
  for(const b of bonusRunsOf(y,m)){if(b.id===BONUS_SKIP)continue;const x=b.rows[emp.code];if(x){inc+=num(x.gross);wht+=num(x.wht);sso+=num(x.sso);pf+=num(x.pf);}}
  return{inc:r2(inc),wht:r2(wht),sso:r2(sso),pf:r2(pf)};}
function isBonusRegister(p){
  const R=p.reg.rows;
  return /bonus/i.test(p.file||'')||/bonus/i.test(p.reg.sheet||'')||(R.length>0&&R.every(x=>!x.sal)&&R.some(x=>x.inc||x.oadd||x.ot));
}
/* gross bonus per row: bonus columns only, unless the net pay only ties when the remuneration column is counted too */
function bonusGross(x){
  const ded=x.wht+x.sso+x.pf+x.loan+x.oded;const a=r2(x.ot+x.inc+x.oadd),b=r2(x.sal+x.ot+x.inc+x.oadd);
  if(a>0&&Math.abs(a-ded-x.net)<1)return a;if(Math.abs(b-ded-x.net)<1)return b;return a>0?a:b;
}
function bonusSummary(p){
  const R=p.reg.rows.map(x=>Object.assign({},x,{gross:bonusGross(x)}));const sum=k=>r2(R.reduce((s,x)=>s+num(x[k]),0));
  const known=new Set(S.employees.map(e=>e.code));const unknown=R.filter(x=>!x.code||!known.has(x.code));
  const existing=bonusRunsOf(p.reg.y,p.reg.m);
  let tcGross=null;const hasB=S.employees.some(e=>e.history2026&&e.history2026.otherB&&(e.history2026.otherB[p.reg.m]!=null||e.history2026.otherB[String(p.reg.m)]!=null));
  if(hasB)tcGross=r2(S.employees.reduce((s,e)=>{const o=(e.history2026||{}).otherB||{};return s+num(o[p.reg.m]!=null?o[p.reg.m]:o[String(p.reg.m)]);},0));
  return{rows:R,count:R.length,gross:sum('gross'),wht:sum('wht'),sso:sum('sso'),pf:sum('pf'),net:sum('net'),unknown,existing,tcGross,
    inHist:p.reg.y===S.historyYear&&p.reg.m<=S.historyThroughMonth};
}
function applyBonus(p,mode){ // mode: 'replace' (the latest bonus run of the month) or 'add'
  const{y,m}=p.reg;const key=ym(y,m);S.bonusRuns=S.bonusRuns||{};const list=S.bonusRuns[key]=S.bonusRuns[key]||[];
  const s=bonusSummary(p);
  let b=list.find(x=>x.source===p.file)||(mode==='replace'&&list.length?list[list.length-1]:null);
  if(!b){b={id:'B'+Date.now().toString(36),label:'',payDate:null,source:p.file,rows:{}};list.push(b);}
  b.status='locked';
  b.label=list.length>1?'โบนัส รอบ '+(list.indexOf(b)+1):'โบนัส';b.source=p.file;b.sheet=p.reg.sheet;b.rows={};b.importedAt=new Date().toISOString();
  for(const x of s.rows){if(!x.code||!S.employees.some(e=>e.code===x.code))continue;
    b.rows[x.code]={name:x.name,gross:x.gross,wht:x.wht,sso:x.sso,pf:x.pf,loan:x.loan,oded:x.oded,net:x.net,acct:fmtAcct(x.acct)};}
  queueSave();return{b,count:Object.keys(b.rows).length,skipped:s.unknown.map(x=>x.code||x.name)};
}

function bonusTotals(b){const R=Object.entries(b.rows).map(([code,x])=>Object.assign({code,e:S.employees.find(e=>e.code===code)},x));
  const sum=k=>r2(R.reduce((s,x)=>s+num(x[k]),0));return{R,gross:sum('gross'),wht:sum('wht'),sso:sum('sso'),pf:sum('pf'),loan:sum('loan'),net:sum('net')};}
/* bonus runs created in the app: enter each person's bonus; WHT = extra annual tax the bonus causes (marginal rate),
   computed from the year's actuals + projection, other bonus runs included; can be set by hand */
let BONUS_SKIP=null;
function bonusAutoWht(e,b,amount){if(!(amount>0))return 0;BONUS_SKIP=b.id;
  try{const run=S.runs[pkey()];const r=(run&&run.rows[e.code])||{};const d=computeWHT(e,r,P.y,P.m).detail;
    return r2(Math.max(0,annualTax(e,d.annReg,d.annOther+amount,d.annSSO,d.annPF).tax-annualTax(e,d.annReg,d.annOther,d.annSSO,d.annPF).tax));}
  finally{BONUS_SKIP=null;}}
function recalcBonus(b){if(b.status!=='draft')return;
  for(const[code,x]of Object.entries(b.rows)){const e=S.employees.find(z=>z.code===code);if(!e)continue;
    x.wht=x.whtOvr!=null?num(x.whtOvr):bonusAutoWht(e,b,num(x.gross));x.net=r2(num(x.gross)-x.wht-num(x.sso)-num(x.pf)-num(x.loan)-num(x.oded));}}

/* BBL payroll direct-credit file: fixed-width 128-char records, CRLF */
function bblTxt(lines,payDate){
  const pad=(s,n)=>String(s).slice(0,n).padEnd(n,' ');
  const z=(v,n)=>String(v).padStart(n,'0').slice(-n);
  const co=digits(S.company.payBankAcct);const[yy,mm,dd]=String(payDate).split('-');
  const date=dd+mm+yy.slice(2);
  const out=['H'+z(1,6)+'002'+z(co,10)+pad(S.company.bblName||'CET',25)+date];
  let seq=1,tot=0;
  for(const x of lines){seq++;const sat=Math.round(x.amount*100);tot+=sat;
    out.push('D'+z(seq,6)+'002'+z(digits(x.acct),10)+'C'+z(sat,10)+'029'+''.padEnd(59,'0')+pad(x.name,35));}
  seq++;
  out.push('T'+z(seq,6)+'002'+z(co,10)+z(0,7)+z(0,13)+z(lines.length,7)+z(tot,13));
  return out.map(l=>l.padEnd(128,'0').slice(0,128)).join('\r\n')+'\r\n';
}

  if(bad.length){toast('แก้เลขบัญชีก่อน: '+bad.map(x=>x.code).join(', '));return;}
  saveFile(`CET ${P.y}${String(P.m).padStart(2,'0')}.txt`,bblTxt(lines,(run&&run.payDate)||defaultPayDate()));
}

  if((x=s.match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})/)))return{y:fixY(x[3]),m:Number(x[2]),d:Number(x[1])};

function nextCode(taken){let mx=0;for(const e of S.employees){const x=String(e.code).match(/^CET(\d+)$/);if(x)mx=Math.max(mx,Number(x[1]));}

function applyRegister(p){

    if(x.position)e.position=x.position;if(x.dept)e.dept=x.dept;if(x.email&&!e.email)e.email=x.email;

    run.rows[code]={ot:x.ot,incentive:x.inc,otherAdd:x.oadd,studentLoan:x.loan,otherDed:x.oded,paidAdvance:0,whtOverride:x.wht,ssoOverride:x.sso,pfOverride:x.pf,

        if(g(t.inc)||g(t.oth)||g(t.wht)){H.income[mm]=g(t.inc);H.other[mm]=g(t.oth);H.wht[mm]=g(t.wht);H.ssf[mm]=g(t.ssf);H.pf[mm]=g(t.pf);
          if(g(t.othB))H.otherB[mm]=g(t.othB);if(g(t.whtB))H.whtB[mm]=g(t.whtB);}}
      for(const[k,v]of Object.entries(t.allow))if(k)e.allowances[k]=v;

    H.income[m]=x.sal;H.other[m]=r2(x.ot+x.inc+x.oadd);H.wht[m]=x.wht;H.ssf[m]=x.sso;H.pf[m]=x.pf;H.loan[m]=x.loan;H.oded[m]=x.oded;H.net[m]=x.net;
    touched.add(code);
  }
  for(const e of S.employees)if(!touched.has(e.code)&&isEmployed(e,y,m))run.rows[e.code]=Object.assign(blankRow(),{exclude:true});
  S.runs[key]=run;
  if(m>S.historyThroughMonth)S.historyThroughMonth=m;
  queueSave();

async function openWorkbookItem(it,pw){
  try{
    let bytes=it.bytes;

      if(!pw){it.status='password';it.msg='ไฟล์นี้ตั้งรหัสผ่านไว้ — ใส่รหัสเพื่อเปิดในเบราว์เซอร์เครื่องนี้ (รหัสไม่ถูกส่งออกไปไหน)';renderImportCards();return;}
      it.status='decrypting';it.msg='กำลังถอดรหัส…';renderImportCards();
      bytes=await decryptAgile(bytes,pw,f=>{it.msg=`กำลังถอดรหัส… ${Math.round(f*100)}%`;renderImportCards();});
    }
    it.msg='กำลังอ่านข้อมูล…';renderImportCards();
    const wb=XLSX.read(bytes,{type:'array'});
    if(isMpaWorkbook(wb)){
      const parsed=parseMpa(wb,it.name);
      if(parsed.period&&parsed.period!==pkey()){const[y,m]=parsed.period.split('-').map(Number);P={y,m};try{sessionStorage.setItem('cet.period',y+'-'+m);}catch(e){}}
      const run=getRun(true);
      if(run.status==='locked'){it.kind='mpa';it.status='error';it.msg=`งวด ${pkey()} ปิดแล้ว — เปิดงวดก่อนจึงจะนำ MPA เข้าได้`;}
      else{run.mpa=Object.assign(parsed,{});it.kind='mpa';it.status='review';
        it.msg=`งวด ${parsed.period} · ${parsed.lines.length} รายการ · ตรวจในขั้นที่ 2 แล้วกด "สร้างงวด"`;queueSave();}
    }else if(isRegisterWorkbook(wb)){
      const p=parseRegisterWorkbook(wb,it.name);IMP.register=p;it.kind='register';it.status='review';
      it.msg=p.bonus?`ทะเบียนโบนัส · ชีต ${p.reg.sheet} · ${p.reg.rows.length} คน · ตรวจยอดด้านล่างแล้วกด "บันทึกเป็นรอบโบนัส" (ไม่ทับรอบเงินเดือน)`
        :`ชีต ${p.reg.sheet} · ${p.reg.rows.length} คน${p.tc?' · '+p.tc.sheet:''} · ตรวจยอดด้านล่างแล้วกด "บันทึกเป็นยอดจริง"`;
    }else{
      const r=importDataWorkbook(wb);
      if(r.empN||r.runN||r.histN||r.compN){it.kind='data';it.status='done';it.msg=`พนักงาน ${r.empN} · ยอดงวด ${r.runN} · ยอดจริง ${r.histN} รายการ${r.compN?' · ข้อมูลบริษัท '+r.compN+' ช่อง':''} (ถึงเดือน ${S.historyThroughMonth})`;queueSave();}
      else if(r.legacy){importLegacyRegister(r.legacy);it.kind='legacy';it.status='done';it.msg='นำยอดจากชีต '+r.legacy.name+' เข้าทะเบียนจ่ายงวดนี้';}
      else if(wb.SheetNames.includes('Payroll')&&wb.SheetNames.some(n=>/^sheet\d/i.test(n))){addDocs([{name:it.name,size:it.size}],true);it.kind='bbl';it.status='done';it.msg='บันทึกเป็นเอกสารประกอบ (ไฟล์โอน BBL)';}
      else{it.kind='doc';it.status='error';it.msg='ไม่รู้จักรูปแบบไฟล์ Excel นี้';}
    }
    it.bytes=null;
  }catch(e){it.status=/รหัสผ่าน/.test(e.message)?'password':'error';it.msg=e.message||String(e);}
  render();
}
function importDataWorkbook(wb){
  let empN=0,runN=0,histN=0,legacy=null;
  const sheets=wb.SheetNames.map(name=>{const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1});
    return{name,aoa,hdr:(aoa[0]||[]).map(v=>String(v==null?'':v).trim().toLowerCase())};});
  const isEmp=s=>/^employees$/i.test(s.name.trim())||(s.hdr[0]==='code'&&s.hdr.includes('name')&&s.hdr.includes('salary'));
  for(const s of sheets.filter(isEmp))empN+=importEmpSheet(s.aoa,s.hdr);
  for(const s of sheets){
    if(!s.aoa.length||isEmp(s))continue;
    const mRun=s.name.trim().match(/^run[-_ ](\d{4})-(\d{1,2})$/i),mHist=s.name.trim().match(/^history[-_ ](\d{4})$/i);
    if(mRun&&s.hdr.includes('code')){runN+=importRunSheet(s.aoa,s.hdr,ym(Number(mRun[1]),Number(mRun[2])));continue;}
    if(mHist&&s.hdr.includes('code')&&s.hdr.includes('month')){histN+=importHistSheet(s.aoa,s.hdr,Number(mHist[1]));continue;}
    if(!legacy)for(let i=0;i<Math.min(s.aoa.length,12);i++){const row=(s.aoa[i]||[]).map(v=>String(v||'').toLowerCase());
      if(row[0]==='no'&&row.some(v=>v&&v.includes('employee'))){legacy={name:s.name,aoa:s.aoa,hdr:i};break;}}
  }
  let compN=0; // optional "Company" sheet: Field | Value rows set company settings
  for(const s of sheets.filter(s=>/^company$/i.test(s.name.trim())))for(const r of s.aoa.slice(1)){
    const k=String((r||[])[0]==null?'':r[0]).trim(),v=(r||[])[1];
    if(k&&k in S.company&&v!=null&&String(v).trim()!==''){S.company[k]=String(v).trim();compN++;}}
  return{empN,runN,histN,legacy,compN};
}

function handleSeed(obj){
  if(obj&&obj.type==='cet-payroll-seed'&&Array.isArray(obj.employees)){
    const existing=new Map(S.employees.map(e=>[e.code,e]));let added=0,updated=0;
    for(const e of obj.employees){if(existing.has(e.code)){Object.assign(existing.get(e.code),e);updated++;}else{S.employees.push(e);added++;}}
    if(obj.company)S.company=Object.assign(S.company,obj.company);
    if(obj.historyYear)S.historyYear=obj.historyYear;
    if(obj.historyThroughMonth)S.historyThroughMonth=obj.historyThroughMonth;
    let patched=0;
    if(obj.runsPatch){for(const[k,rp]of Object.entries(obj.runsPatch)){
      const run=S.runs[k]||(S.runs[k]={status:'draft',payDate:null,rows:{}});
      if(rp.payDate)run.payDate=rp.payDate;
      for(const[code,row]of Object.entries(rp.rows||{})){
        const base=run.rows[code]||blankRow();
        run.rows[code]=Object.assign(base,row);patched++;
      }}}
    queueSave();render();toast(`นำเข้าแล้ว: เพิ่ม ${added} คน อัปเดต ${updated} คน${patched?` · เติมยอดงวด ${patched} รายการ`:''}`);
  }else if(obj&&obj.employees&&obj.runs){S=Object.assign(defaultState(),obj);migrate();queueSave();render();toast('กู้คืนข้อมูลสำรองแล้ว');}
  else toast('ไฟล์ไม่ใช่รูปแบบ seed / backup ของ CET Payroll');
}
const EMP_COLS={code:'code',name:'name',nameth:'nameTh',taxid:'taxId',ssoid:'ssoId',position:'position',dept:'dept',email:'email',salary:'salary',pfrate:'pfRate',pferrate:'pfErRate',
  bankacct:'bankAcct',startym:'startYM',status:'status',resignym:'resignYM',nationality:'nationality',loanmonthly:'loanMonthly',ssoexempt:'ssoExempt',bankfile:'bankTransfer',note:'startNote'};
const ALLOW_COLS={allow_self:'self',allow_spouse:'spouse',allow_childns:'childNS',allow_childs:'childS',allow_parent:'parent',allow_lifeins:'lifeIns',allow_rmf_ltf:'rmfLtf',allow_ssf_esg:'ssfEsg',allow_special:'special',allow_housing:'housing',allow_donation:'donation'};
const EMP_HDR=['Code','Name','NameTH','TaxID','SSOID','Position','Dept','Email','Salary','PFRate','PFErRate','BankAcct','BankFile','SSOExempt','LoanMonthly',
  'RecurLabel','RecurAmount','RecurFrom','RecurTo','WHTLevelYear','WHTLevel','WHTLevelBase','StartYM','Status','ResignYM','Nationality','Note',
  'Allow_Self','Allow_Spouse','Allow_ChildNS','Allow_ChildS','Allow_Parent','Allow_LifeIns','Allow_RMF_LTF','Allow_SSF_ESG','Allow_Special','Allow_Housing','Allow_Donation'];

let lastXlsxName='';
const yes=v=>/^(y|yes|true|1|x|✓|ใช่)$/i.test(String(v==null?'':v).trim());
function ymOf(v){
  if(v==null||v==='')return'';
  if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0');
  if(typeof v==='number'&&v>20000){const d=XLSX.SSF.parse_date_code(v);return d?d.y+'-'+String(d.m).padStart(2,'0'):'';}
  const s=String(v).trim();const m=s.match(/^(\d{4})[-\/.](\d{1,2})/);return m?m[1]+'-'+String(Number(m[2])).padStart(2,'0'):s;
}
function handleXlsx(buf){
  try{
    const wb=XLSX.read(buf,{type:'array'});
    if(isMpaWorkbook(wb)){handleMpaWorkbook(wb,lastXlsxName);return;}
    let empN=0,runN=0,histN=0,legacy=null;
    const sheets=wb.SheetNames.map(name=>{const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1});
      return{name,aoa,hdr:(aoa[0]||[]).map(v=>String(v==null?'':v).trim().toLowerCase())};});
    const isEmp=s=>/^employees$/i.test(s.name.trim())||(s.hdr[0]==='code'&&s.hdr.includes('name')&&s.hdr.includes('salary'));
    for(const s of sheets.filter(isEmp))empN+=importEmpSheet(s.aoa,s.hdr);
    for(const s of sheets){
      if(!s.aoa.length||isEmp(s))continue;
      const mRun=s.name.trim().match(/^run[-_ ](\d{4})-(\d{1,2})$/i);
      const mHist=s.name.trim().match(/^history[-_ ](\d{4})$/i);
      if(mRun&&s.hdr.includes('code')){runN+=importRunSheet(s.aoa,s.hdr,ym(Number(mRun[1]),Number(mRun[2])));continue;}
      if(mHist&&s.hdr.includes('code')&&s.hdr.includes('month')){histN+=importHistSheet(s.aoa,s.hdr,Number(mHist[1]));continue;}
      if(!legacy){
        for(let i=0;i<Math.min(s.aoa.length,12);i++){
          const row=(s.aoa[i]||[]).map(v=>String(v||'').toLowerCase());
          if(row[0]==='no'&&row.some(v=>v&&v.includes('employee'))){legacy={name:s.name,aoa:s.aoa,hdr:i};break;}
        }
      }
    }
    if(empN||runN||histN){queueSave();render();toast(`นำเข้า Excel แล้ว: พนักงาน ${empN} · ยอดงวด ${runN} · ยอดจริง ${histN} รายการ${histN?' (ถึงเดือน '+S.historyThroughMonth+')':''}`);return;}
    if(legacy){importLegacyRegister(legacy);return;}
    toast('ไม่พบชีตที่รู้จัก — ใช้ MPA, ชีต Employees / Run-YYYY-MM / History-YYYY หรือทะเบียนจ่ายรูปแบบเดิม');
  }catch(e){toast('อ่านไฟล์ Excel ไม่สำเร็จ: '+e.message);}
}
function importEmpSheet(aoa,hdr){
  let n=0;const ci=h=>hdr.indexOf(h);const ciCode=ci('code');
  for(let i=1;i<aoa.length;i++){
    const row=aoa[i];if(!row)continue;
    const code=String(row[ciCode]==null?'':row[ciCode]).trim();if(!code)continue;
    let e=S.employees.find(x=>x.code===code);
    if(!e){e={code,name:'',salary:0,pfRate:0,bankAcct:'',taxId:'',position:'',dept:'',email:'',status:'active',allowances:{self:60000}};S.employees.push(e);}
    const cell=h=>{const c=ci(h);if(c<0)return undefined;const v=row[c];return v==null||String(v).trim()===''?undefined:v;};
    for(const[h,f]of Object.entries(EMP_COLS)){
      if(f==='code')continue;let v=cell(h);if(v===undefined)continue;
      if(['salary','pfRate','pfErRate','loanMonthly'].includes(f))v=num(v);
      else if(f==='startYM'||f==='resignYM')v=ymOf(v);
      else if(f==='status')v=/resign|ลาออก/i.test(String(v))?'resigned':'active';
      else if(f==='ssoExempt')v=yes(v);
      else if(f==='bankTransfer')v=!/^(n|no|false|0)$/i.test(String(v).trim());
      else v=String(v).trim();
      e[f]=v;
    }
    if(cell('recuramount')!==undefined){const a=num(cell('recuramount'));
      e.recurring=a?[{label:String(cell('recurlabel')||''),amount:a,fromYM:ymOf(cell('recurfrom')),toYM:ymOf(cell('recurto'))}]:[];}
    if(cell('whtlevel')!==undefined){const y=Number(cell('whtlevelyear'))||P.y;e.whtLevel=e.whtLevel||{};
      e.whtLevel[y]={amt:num(cell('whtlevel')),base:cell('whtlevelbase')!==undefined?num(cell('whtlevelbase')):num(e.salary)};}
    e.allowances=e.allowances||{};
    for(const[h,k]of Object.entries(ALLOW_COLS)){const v=cell(h);if(v===undefined)continue;e.allowances[k]=num(v);}
    n++;
  }
  return n;
}
function importRunSheet(aoa,hdr,key){
  const run=S.runs[key]||(S.runs[key]={status:'draft',payDate:null,rows:{}});
  const F={salaryoverride:'salaryOverride',ot:'ot',incentive:'incentive',otheradd:'otherAdd',studentloan:'studentLoan',otherded:'otherDed',paidadvance:'paidAdvance',whtoverride:'whtOverride',ssooverride:'ssoOverride',pfoverride:'pfOverride'};
  let n=0;const ciCode=hdr.indexOf('code');
  for(let i=1;i<aoa.length;i++){
    const row=aoa[i];if(!row)continue;
    const code=String(row[ciCode]==null?'':row[ciCode]).trim();if(!code)continue;
    const r=rowOf(run,code);
    for(const[h,f]of Object.entries(F)){
      const ci=hdr.indexOf(h);if(ci<0)continue;const v=row[ci];
      if(v==null||String(v).trim()==='')continue;r[f]=num(v);
    }
    n++;
  }
  return n;
}
function importHistSheet(aoa,hdr,year){
  let n=0,maxM=0;const ciCode=hdr.indexOf('code'),ciM=hdr.indexOf('month');
  if(year&&year!==S.historyYear){S.historyYear=year;S.historyThroughMonth=0;}
  for(let i=1;i<aoa.length;i++){
    const row=aoa[i];if(!row)continue;
    const code=String(row[ciCode]==null?'':row[ciCode]).trim();if(!code)continue;
    const emp=S.employees.find(x=>x.code===code);if(!emp)continue;
    const m=Math.round(num(row[ciM]));if(m<1||m>12)continue;
    emp.history2026=emp.history2026||{};
    for(const[h,k]of Object.entries(HIST_KEYS)){
      const ci=hdr.indexOf(h);if(ci<0)continue;const v=row[ci];
      if(v==null||String(v).trim()==='')continue;
      emp.history2026[k]=emp.history2026[k]||{};emp.history2026[k][m]=num(v);
    }
    maxM=Math.max(maxM,m);n++;
  }
  if(maxM>S.historyThroughMonth)S.historyThroughMonth=maxM;
  return n;
}
function importLegacyRegister(best){
  const run=getRun(true);let n=0;
  for(let i=best.hdr+1;i<best.aoa.length;i++){
    const row=best.aoa[i];if(!row)continue;const code=String(row[0]||'').trim();
    if(!/^CE/i.test(code))continue;
    const emp=S.employees.find(x=>x.code===code);if(!emp)continue;
    const r=rowOf(run,code);
    const sal=num(row[2]);if(sal&&Math.abs(sal-emp.salary)>0.005)r.salaryOverride=sal;
    r.ot=num(row[3]);r.incentive=num(row[4]);r.otherAdd=num(row[5]);
    const wht=num(row[7]);r.whtOverride=wht||wht===0?wht:null;
    const sso=num(row[8]);if(sso)r.ssoOverride=sso;
    const pf=num(row[9]);r.pfOverride=pf;
    r.studentLoan=num(row[10]);r.otherDed=num(row[11]);
    n++;
  }
  queueSave();go('run');toast(`นำเข้ายอดจากชีต ${best.name} แล้ว ${n} คน (ภาษีตั้งเป็นค่าจากไฟล์ — ลบ override ได้ในหน้าต่างวิธีคำนวณ)`);
}
function exportEmpXlsx(){

  for(const e of [...S.employees].sort((a,b)=>a.code.localeCompare(b.code))){
    const A=e.allowances||{};const rc=(e.recurring||[])[0]||{};const lv=e.whtLevel&&e.whtLevel[P.y];

      e.bankTransfer===false?'N':'Y',e.ssoExempt?'Y':'',num(e.loanMonthly)||'',rc.label||'',num(rc.amount)||'',rc.fromYM||'',rc.toYM||'',
      lv?P.y:'',lv?lv.amt:'',lv?lv.base:'',e.startYM||'',e.status||'active',e.resignYM||'',e.nationality||'',e.startNote||'',
      A.self||0,A.spouse||0,A.childNS||0,A.childS||0,A.parent||0,A.lifeIns||0,A.rmfLtf||0,A.ssfEsg||0,A.special||0,A.housing||0,A.donation||0]);
  }
  const hist=[['Code','Month','Income','Other','WHT','SSF','PF','Loan','OtherDed','Net']];
  for(const e of S.employees){const h=e.history2026;if(!h)continue;
    for(let m=1;m<=12;m++){
      const g=k=>{const o=h[k]||{};return o[m]!=null?o[m]:(o[String(m)]!=null?o[String(m)]:null);};
      const vals=['income','other','wht','ssf','pf','loan','oded','net'].map(g);

  saveFile('cet-payroll-employees.xlsx',aoaToXlsx([

    {name:'History-'+S.historyYear,aoa:hist,widths:[9,6,11,11,11,9,9,9,9,11]}]));
}

  rest.addEventListener('change',()=>{const f=rest.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o.employees&&o.settings){S=Object.assign(defaultState(),o);S.settings=Object.assign(defaultState().settings,o.settings||{});S.company=Object.assign(defaultState().company,o.company||{});migrate();queueSave();render();toast('กู้คืนข้อมูลแล้ว');}else handleSeed(o);}catch(e){toast('อ่านไฟล์ไม่สำเร็จ');}};rd.readAsText(f);rest.value='';});
  const xl=document.createElement('input');xl.type='file';xl.id='fileXlsx';xl.accept='.xlsx,.xlsm,.xls';xl.multiple=true;
  xl.addEventListener('change',()=>{handleFiles(xl.files);xl.value='';});
  const any=document.createElement('input');any.type='file';any.id='fileAny';any.multiple=true;
  any.addEventListener('change',()=>{handleFiles(any.files);any.value='';});
  const dc=document.createElement('input');dc.type='file';dc.id='fileDocs';dc.multiple=true;
  dc.addEventListener('change',()=>{if(dc.files.length)addDocs(dc.files);dc.value='';});
  document.body.append(seed,rest,xl,dc,any);
  let depth=0;const ov=document.getElementById('dropOverlay');
  const hasFiles=ev=>ev.dataTransfer&&[...ev.dataTransfer.types].includes('Files');
  document.addEventListener('dragenter',ev=>{if(!hasFiles(ev))return;depth++;ov.hidden=false;});
  document.addEventListener('dragleave',ev=>{if(!hasFiles(ev))return;depth=Math.max(0,depth-1);if(!depth)ov.hidden=true;});
  document.addEventListener('dragover',ev=>{if(hasFiles(ev))ev.preventDefault();});
  document.addEventListener('drop',ev=>{if(!hasFiles(ev))return;ev.preventDefault();depth=0;ov.hidden=true;handleFiles(ev.dataTransfer.files);});
}

/* ---------- shared server mode (Render): login, one shared encrypted state, version checks ---------- */
const ROLE_TH={admin:'ผู้ดูแลระบบ',editor:'ผู้แก้ไข',viewer:'ดูอย่างเดียว'};
async function api(path,opts={}){
  const o={credentials:'same-origin',headers:{},method:opts.method||'GET'};
  if(opts.body!==undefined){o.body=JSON.stringify(opts.body);o.headers['Content-Type']='application/json';}
  if(o.method!=='GET')o.headers['X-CET']='1';
  let r;try{r=await fetch(path,o);}catch(e){return{status:0,ok:false,data:{detail:'ติดต่อเซิร์ฟเวอร์ไม่ได้'}};}
  let j=null;try{j=await r.json();}catch(e){}
  return{status:r.status,ok:r.ok,data:j||{}};
}
const fmtWhen=s=>{if(!s)return '';const d=new Date(s);return isNaN(d)?'':d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});};
async function srvBoot(){
  let h;try{const r=await fetch('/api/health',{cache:'no-store'});if(!r.ok)return;h=await r.json();}catch(e){return;}
  if(!h||h.app!=='cet-payroll')return;
  SRV.on=true;SRV.health=h;S=defaultState();render();setStat('');
  const ft=document.querySelector('#side .foot');if(ft)ft.textContent='ข้อมูลเก็บบนเซิร์ฟเวอร์แบบเข้ารหัส ใช้ร่วมกันทุกคนที่เข้าสู่ระบบ';
  const me=await api('/api/me');
  if(me.ok)await srvOnLogin(me.data.user);else srvShowLogin();
}
function srvShowLogin(msg){
  const dlg=document.getElementById('dlgLogin');const noUsers=SRV.health&&!SRV.health.has_users;
  dlg.innerHTML=`<form id="loginForm" class="login">
    <div class="brand"><div class="logo">CE</div><div><b>CET Payroll</b><small>เข้าสู่ระบบเพื่อใช้ข้อมูลเงินเดือนร่วมกัน</small></div></div>
    ${noUsers?'<div class="note warn">ยังไม่มีผู้ดูแลระบบ — ตั้งค่า ADMIN_USERNAME และ ADMIN_PASSWORD ใน Render → Environment แล้ว deploy ใหม่</div>':''}
    <label>ชื่อผู้ใช้<input id="lgUser" autocomplete="username" autocapitalize="none" required></label>
    <label>รหัสผ่าน<input id="lgPass" type="password" autocomplete="current-password" required></label>
    <div id="lgMsg" class="lgmsg" role="alert">${esc(msg||'')}</div>
    <button class="btn pri" type="submit">เข้าสู่ระบบ</button>
  </form>`;
  dlg.addEventListener('cancel',ev=>ev.preventDefault(),{once:false});
  if(!dlg.open)dlg.showModal();
  document.getElementById('lgUser').focus();
  document.getElementById('loginForm').addEventListener('submit',async ev=>{
    ev.preventDefault();const m=document.getElementById('lgMsg');m.textContent='กำลังตรวจสอบ…';
    const r=await api('/api/login',{method:'POST',body:{username:document.getElementById('lgUser').value,password:document.getElementById('lgPass').value}});
    if(r.ok){dlg.close();await srvOnLogin(r.data.user);}
    else m.textContent=r.status===429?'ใส่รหัสผิดหลายครั้ง — ลองใหม่ในอีก 15 นาที':r.status===401?'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง':(r.data.detail||'เข้าสู่ระบบไม่สำเร็จ');
  });
}
async function srvOnLogin(user){
  SRV.user=user;renderUserChip();await srvLoad();
  clearInterval(SRV.poll);SRV.poll=setInterval(srvPoll,20000);
}
function renderUserChip(){
  const el=document.getElementById('userchip');if(!el)return;
  if(!SRV.on||!SRV.user){el.innerHTML='';return;}
  el.innerHTML=`<span class="chip ${SRV.user.role==='viewer'?'a':'g'}" title="${esc(SRV.user.username)}">${esc(SRV.user.name||SRV.user.username)} · ${ROLE_TH[SRV.user.role]}</span>
    <button class="btn sm" onclick="srvLogout()">ออกจากระบบ</button>`;
}
window.srvLogout=async function(){await api('/api/logout',{method:'POST'});location.reload();};
function loadInto(p){
  S=Object.assign(defaultState(),p);S.settings=Object.assign(defaultState().settings,p.settings||{});
  S.settings.accounts=Object.assign(defaultState().settings.accounts,(p.settings||{}).accounts||{});
  S.company=Object.assign(defaultState().company,p.company||{});migrate();
}
async function srvLoad(quiet){
  const r=await api('/api/state');
  if(r.status===401){srvShowLogin('หมดเวลาเข้าสู่ระบบ — เข้าสู่ระบบใหม่');return;}
  if(!r.ok){toast(r.data.detail||'โหลดข้อมูลไม่สำเร็จ');return;}
  SRV.version=r.data.version;SRV.updatedBy=r.data.updated_by;SRV.updatedAt=r.data.updated_at;
  if(r.data.data)loadInto(r.data.data);else S=defaultState();
  render();
  setStat(SRV.version?`เวอร์ชัน ${SRV.version} · ${SRV.updatedBy||''} ${fmtWhen(SRV.updatedAt)}`:'ยังไม่มีข้อมูล — เริ่มที่หน้า นำเข้าข้อมูล');
  if(!quiet&&SRV.user.role==='viewer')toast('สิทธิ์ดูอย่างเดียว — การแก้ไขจะไม่ถูกบันทึก');
}
async function srvSave(){
  if(!SRV.user)return;
  if(SRV.user.role==='viewer'){setStat('ดูอย่างเดียว — ไม่ได้บันทึก');return;}
  if(SRV.inflight){SRV.dirty=true;return;}
  SRV.inflight=true;SRV.dirty=false;setStat('กำลังบันทึกขึ้นเซิร์ฟเวอร์…');
  const r=await api('/api/state',{method:'PUT',body:{base_version:SRV.version,data:S,note:SRV.note||'save'}});
  SRV.note=null;SRV.inflight=false;
  if(r.ok){SRV.version=r.data.version;SRV.updatedBy=SRV.user.username;SRV.updatedAt=new Date().toISOString();
    setStat(`บันทึกแล้ว ✓ เวอร์ชัน ${SRV.version}`);if(SRV.dirty)srvSave();}
  else if(r.status===409)srvConflict(r.data);
  else if(r.status===401)srvShowLogin('หมดเวลาเข้าสู่ระบบ — เข้าสู่ระบบใหม่ แล้วบันทึกอีกครั้ง');
  else setStat('⚠ บันทึกไม่สำเร็จ — '+(r.data.detail||r.status));
}
function srvConflict(info){
  setStat('⚠ ยังไม่ได้บันทึก — มีคนอื่นบันทึกก่อน');
  const dlg=document.getElementById('dlgConflict');
  dlg.innerHTML=`<div class="dhd"><h3>มีการบันทึกใหม่ระหว่างที่คุณแก้ไข</h3></div>
  <div class="dbd"><p><b>${esc(info.updated_by||'ผู้ใช้อื่น')}</b> บันทึกเวอร์ชัน ${info.version} เมื่อ ${esc(fmtWhen(info.updated_at))} การแก้ไขล่าสุดของคุณยังไม่ได้บันทึก</p>
  <p class="sub">โหลดข้อมูลล่าสุด = เห็นงานของ ${esc(info.updated_by||'อีกคน')} แต่การแก้ไขของคุณที่ยังไม่บันทึกจะหาย · บันทึกทับ = ใช้ข้อมูลบนจอของคุณแทนเวอร์ชันของอีกคน (ระบบบันทึกประวัติไว้)</p></div>
  <div class="dft"><button class="btn" id="cfOver">บันทึกทับด้วยข้อมูลของฉัน</button><button class="btn pri" id="cfLoad">โหลดข้อมูลล่าสุด</button></div>`;
  dlg.showModal();
  document.getElementById('cfLoad').onclick=async()=>{dlg.close();await srvLoad(true);toast('โหลดข้อมูลล่าสุดแล้ว');};
  document.getElementById('cfOver').onclick=async()=>{dlg.close();SRV.version=info.version;SRV.note='overwrite';await srvSave();};
}
async function srvPoll(){
  if(!SRV.user||SRV.inflight||SRV.pending||document.hidden)return;
  if(document.querySelector('dialog[open]'))return;
  const r=await api('/api/state/version');
  if(r.status===401){clearInterval(SRV.poll);srvShowLogin('หมดเวลาเข้าสู่ระบบ — เข้าสู่ระบบใหม่');return;}
  if(r.ok&&r.data.version>SRV.version&&!SRV.pending&&!SRV.inflight){await srvLoad(true);toast(`อัปเดตข้อมูลล่าสุดจาก ${r.data.updated_by||'ผู้ใช้อื่น'}`);}
}
/* settings panels: my account, users, history */
async function srvPanels(){
  const box=document.getElementById('srvPanels');if(!box||!SRV.on||!SRV.user)return;
  const U=SRV.user;const h=SRV.health||{};
  let html=`<div class="panel"><div class="hd"><h3>บัญชีของฉัน</h3></div><div class="bd">
    <p class="sub">${esc(U.name)} (${esc(U.username)}) · สิทธิ์ ${ROLE_TH[U.role]}</p>
    <form id="pwForm" class="fgrid"><label>รหัสผ่านปัจจุบัน<input type="password" id="pwOld" autocomplete="current-password" required></label>
      <label>รหัสผ่านใหม่ (อย่างน้อย 10 ตัว)<input type="password" id="pwNew" autocomplete="new-password" minlength="10" required></label>
      <div style="align-self:end"><button class="btn" type="submit">เปลี่ยนรหัสผ่าน</button></div></form></div></div>`;
  if(U.role==='admin'){
    const [us,au]=await Promise.all([api('/api/users'),api('/api/audit?limit=40')]);
    const rows=(us.data.users||[]).map(u=>`<tr><td class="num">${esc(u.username)}</td><td>${esc(u.name)}</td>
      <td><select data-urole="${u.id}">${Object.entries(ROLE_TH).map(([k,v])=>`<option value="${k}" ${k===u.role?'selected':''}>${v}</option>`).join('')}</select></td>
      <td><input type="checkbox" data-uact="${u.id}" ${u.active?'checked':''} aria-label="ใช้งานได้"></td><td>${esc(fmtWhen(u.last_login))||'—'}</td>
      <td><input type="password" data-upw="${u.id}" placeholder="รหัสใหม่" autocomplete="new-password" style="width:130px"> <button class="btn sm" data-upwb="${u.id}">ตั้งรหัส</button></td></tr>`).join('');
    const ACT={save:'บันทึก',overwrite:'บันทึกทับ',restore:'กู้คืน',password:'เปลี่ยนรหัสผ่าน',user_create:'เพิ่มผู้ใช้',user_edit:'แก้ผู้ใช้',bootstrap_admin:'สร้างผู้ดูแลแรก'};
    const arows=(au.data.audit||[]).map(a=>`<tr><td>${esc(fmtWhen(a.at))}</td><td>${esc(a.username)}</td><td>${esc(ACT[a.action]||a.action)}</td><td class="num">${a.version||''}</td><td class="name-cell" style="max-width:320px">${esc(a.detail||'')}</td></tr>`).join('');
    html+=`<div class="panel"><div class="hd"><h3>ผู้ใช้งาน</h3></div>
      <div class="tblwrap"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>สิทธิ์</th><th>ใช้งาน</th><th>เข้าล่าสุด</th><th>รีเซ็ตรหัสผ่าน</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="bd"><form id="addUser" class="fgrid">
        <label>ชื่อผู้ใช้ (a-z 0-9 . _ -)<input id="nuUser" autocomplete="off" required pattern="[a-zA-Z0-9._\\-]{3,40}"></label>
        <label>ชื่อที่แสดง<input id="nuName"></label>
        <label>สิทธิ์<select id="nuRole"><option value="editor">ผู้แก้ไข</option><option value="viewer">ดูอย่างเดียว</option><option value="admin">ผู้ดูแลระบบ</option></select></label>
        <label>รหัสผ่านเริ่มต้น (อย่างน้อย 10 ตัว)<input id="nuPass" type="password" autocomplete="new-password" minlength="10" required></label>
        <div style="align-self:end"><button class="btn pri" type="submit">+ เพิ่มผู้ใช้</button></div></form>
      <p class="sub">ผู้ดูแลระบบ: จัดการผู้ใช้และดูประวัติ · ผู้แก้ไข: นำเข้า คำนวณ ปิดงวด ส่งออก · ดูอย่างเดียว: เปิดดูและส่งออกไฟล์ได้ แต่บันทึกไม่ได้</p></div></div>
    <div class="panel"><div class="hd"><h3>ประวัติการบันทึก (40 รายการล่าสุด)</h3></div>
      <div class="tblwrap" style="max-height:40vh;overflow-y:auto"><table><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th class="r">เวอร์ชัน</th><th>รายละเอียด</th></tr></thead><tbody>${arows}</tbody></table></div></div>`;
  }
  box.innerHTML=html;
  document.getElementById('pwForm').addEventListener('submit',async ev=>{ev.preventDefault();
    const r=await api('/api/me/password',{method:'POST',body:{old:document.getElementById('pwOld').value,new:document.getElementById('pwNew').value}});
    if(r.ok){toast('เปลี่ยนรหัสผ่านแล้ว — เข้าสู่ระบบใหม่');SRV.user=null;srvShowLogin('เปลี่ยนรหัสผ่านแล้ว — เข้าสู่ระบบด้วยรหัสใหม่');}
    else toast(r.data.detail==='current password is wrong'?'รหัสผ่านปัจจุบันไม่ถูกต้อง':r.data.detail||'เปลี่ยนรหัสผ่านไม่สำเร็จ');});
  if(U.role!=='admin')return;
  const done=r=>{if(r.ok){toast('บันทึกแล้ว');srvPanels();}else{toast(r.data.detail||'ไม่สำเร็จ');srvPanels();}};
  box.querySelectorAll('[data-urole]').forEach(x=>x.addEventListener('change',async()=>done(await api('/api/users/'+x.dataset.urole,{method:'PATCH',body:{role:x.value}}))));
  box.querySelectorAll('[data-uact]').forEach(x=>x.addEventListener('change',async()=>done(await api('/api/users/'+x.dataset.uact,{method:'PATCH',body:{active:x.checked}}))));
  box.querySelectorAll('[data-upwb]').forEach(x=>x.addEventListener('click',async()=>{const i=box.querySelector(`[data-upw="${x.dataset.upwb}"]`);
    done(await api('/api/users/'+x.dataset.upwb,{method:'PATCH',body:{password:i.value}}));}));
  document.getElementById('addUser').addEventListener('submit',async ev=>{ev.preventDefault();
    done(await api('/api/users',{method:'POST',body:{username:document.getElementById('nuUser').value,name:document.getElementById('nuName').value,
      role:document.getElementById('nuRole').value,password:document.getElementById('nuPass').value}}));});
}

/* ---------- boot ---------- */
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
document.getElementById('pprev').addEventListener('click',()=>shiftP(-1));
document.getElementById('pnext').addEventListener('click',()=>shiftP(1));
wireFiles();
plabel();render();setStat(S.employees.length?'พร้อมใช้งาน':'');
srvBoot();
